          ? `依照以下設定建立固定角色，20格皆不得改變角色辨識特徵：${characterDescription.trim()}`
          : '請先在角色描述欄輸入角色外型、顏色、服裝、配件與個性。';
      };

      const getKeyColor = () => KEY_COLORS.find(c => c.id === keyColorId) || KEY_COLORS[0];
      const getProduct = () => PRODUCT_TYPES[productType];
      const getSourceSpec = () => {
        if (productType === 'emoji' || productType === 'animated_emoji') return { w: 2560, h: 2048, cellW: 512, cellH: 512 };
        if (productType === 'animated_sticker') return { w: 2560, h: 1728, cellW: 512, cellH: 432 };
        return { w: 2560, h: 1664, cellW: 512, cellH: 416 };
      };
      const getEmojiLayout = () => EMOJI_LAYOUTS[emojiLayout] || EMOJI_LAYOUTS.icon_text;

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };
      
      const handleDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };
      
      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          loadFile(e.dataTransfer.files[0]);
        }
      };

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          loadFile(e.target.files[0]);
        }
      };

      const loadFile = (file) => {
        setFileName(file.name);
        setPreviewUrl(URL.createObjectURL(file));
        setIsSliced(false);
        setProcessedImages([]);
      };

      const handleReset = () => {
        setPreviewUrl(null);
        setFileName('');
        setIsSliced(false);
        setProcessedImages([]);
        setSliceConfig({ x: 0, y: 0, scale: 100 });
        setStartNumber(1);
        setMainIndex(null);
        setTabIndex(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      // 處理 ZIP 打包下載
      const handleDownloadZip = async () => {
        if (processedImages.length === 0) return;
        if ((!getProduct().emoji && mainIndex === null) || tabIndex === null) {
          alert(getProduct().emoji ? '請先選擇一張 Tab 分頁圖。' : '請先各選擇一張 Main 封面圖與 Tab 分頁圖。');
          return;
        }
        const start = parseInt(startNumber);
        const validStarts = getProduct().animated ? [1, 5] : [1, 21];
        if (!validStarts.includes(start)) {
          alert(getProduct().animated ? '起始編號請輸入1（第一批4個）或5（第二批4個）。' : '起始編號請輸入1（第一批20張）或21（第二批20張）。');
          return;
        }
        const oversized = processedImages.findIndex(dataUrl => Math.ceil((dataUrl.split(',')[1]?.length || 0) * 3 / 4) > 1024 * 1024);
        if (oversized !== -1) {
          alert(`第 ${oversized + 1} 張貼圖超過 LINE 每張 1MB 的限制，請縮小原圖後重試。`);
          return;
        }
        try {
          setIsDownloading(true);
          
          const zip = new window.JSZip();
          // 第一批使用 01–20，第二批使用 21–40。

          // 將圖片縮放至 LINE 官方規範尺寸
          const resizeImage = (dataUrl, targetW, targetH) => {
            return new Promise((resolve) => {
              const img = new window.Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = targetW;
                canvas.height = targetH;
                const ctx = canvas.getContext('2d');
                
                // 保持比例置中縮放
                const scale = Math.min(targetW / img.width, targetH / img.height);
                const nw = img.width * scale;
                const nh = img.height * scale;
                const nx = (targetW - nw) / 2;
                const ny = (targetH - nh) / 2;
                
                ctx.drawImage(img, nx, ny, nw, nh);
                resolve(canvas.toDataURL('image/png').split(',')[1]);
              };
              img.src = dataUrl;
            });
          };

          const dataUrlToRGBA = (dataUrl, targetW, targetH) => new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = targetW; canvas.height = targetH;
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, targetW, targetH);
              const scale = Math.min(targetW / img.width, targetH / img.height);
              const width = img.width * scale, height = img.height * scale;
              ctx.drawImage(img, (targetW - width) / 2, (targetH - height) / 2, width, height);
              resolve(ctx.getImageData(0, 0, targetW, targetH).data.buffer);
            };
            img.src = dataUrl;
          });

          const setAPNGLoopCount = (buffer, plays = 2) => {
            const bytes = new Uint8Array(buffer);
            const crc32 = (arr) => {
              let crc = 0xffffffff;
              for (const value of arr) {
                crc ^= value;
                for (let k = 0; k < 8; k++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
              }
              return (crc ^ 0xffffffff) >>> 0;
            };
            for (let i = 8; i < bytes.length - 16; i++) {
              if (bytes[i] === 97 && bytes[i+1] === 99 && bytes[i+2] === 84 && bytes[i+3] === 76) {
                const view = new DataView(bytes.buffer);
                view.setUint32(i + 8, plays, false);
                view.setUint32(i + 12, crc32(bytes.slice(i, i + 12)), false);
                break;
              }
            }
            return bytes;
          };

          if (getProduct().animated) {
            if (!window.UPNG) throw new Error('APNG元件尚未載入，請重新整理頁面後再試。');
            for (let group = 0; group < 4; group++) {
              const frames = await Promise.all(processedImages.slice(group * 5, group * 5 + 5).map(src => dataUrlToRGBA(src, getProduct().outputW, getProduct().outputH)));
              const apng = window.UPNG.encode(frames, getProduct().outputW, getProduct().outputH, 0, Array(5).fill(frameDelay));
              const maxBytes = getProduct().emoji ? 300 * 1024 : 1024 * 1024;
              if (apng.byteLength > maxBytes) throw new Error(`動畫${group + 1}超過${getProduct().emoji ? '300KB' : '1MB'}，請降低圖片複雜度。`);
              zip.file(`${String(start + group).padStart(getProduct().digits, '0')}.png`, setAPNGLoopCount(apng, 2));
            }
          } else {
            processedImages.forEach((dataUrl, index) => {
              const base64Data = dataUrl.split(',')[1];
              const fileName = `${String(start + index).padStart(getProduct().digits, '0')}.png`;
              zip.file(fileName, base64Data, { base64: true });
            });
          }

          // 寫入 Main 與 Tab 封圖
          if (!getProduct().emoji && mainIndex !== null && processedImages[mainIndex]) {
            if (getProduct().animated) {
              const groupStart = Math.floor(mainIndex / 5) * 5;
              const mainFrames = await Promise.all(processedImages.slice(groupStart, groupStart + 5).map(src => dataUrlToRGBA(src, 240, 240)));
              const mainAPNG = window.UPNG.encode(mainFrames, 240, 240, 0, Array(5).fill(frameDelay));
              zip.file('main.png', setAPNGLoopCount(mainAPNG, 2));
            } else {
              const mainB64 = await resizeImage(processedImages[mainIndex], 240, 240);
              zip.file('main.png', mainB64, { base64: true });
            }
          }
          if (tabIndex !== null && processedImages[tabIndex]) {
            const tabB64 = await resizeImage(processedImages[tabIndex], 96, 74);
            zip.file('tab.png', tabB64, { base64: true });
          }

          // 產生 ZIP
          const content = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(content);
          const a = document.createElement('a');
          a.href = url;
          a.download = `LINE_${getProduct().label}_Pack.zip`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error("打包失敗:", error);
          alert(error?.message || "打包過程發生錯誤，請稍後再試。");
        } finally {
          setIsDownloading(false);
        }
      };

      // 核心演算法：無誤差 Canvas 切割與可選底色智慧去背
      const processImages = async () => {
        if (!previewUrl) return;
        setIsProcessing(true);

        const img = new window.Image();
        img.crossOrigin = "anonymous";
        img.src = previewUrl;

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('圖片讀取失敗'));
        });

        const results = [];
        const spec = getSourceSpec();
        const sliceWidth = spec.cellW;
        const sliceHeight = spec.cellH;
        const originalW = spec.w;
        const originalH = spec.h;

        for (let i = 0; i < 20; i++) {
          if (i % 5 === 0) await new Promise(r => setTimeout(r, 10));

          const canvas = document.createElement('canvas');
          canvas.width = sliceWidth;
          canvas.height = sliceHeight;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          const col = i % 5;
          const row = Math.floor(i / 5);

          // 完美數學對位：先將 Canvas 原點移至該切片的起始位置
          ctx.translate(-col * sliceWidth, -row * sliceHeight);

          // 接著套用使用者設定的全域平移與縮放 (相對於 2560x1664 的中心點)
          const transX = (sliceConfig.x / 100) * originalW;
          const transY = (sliceConfig.y / 100) * originalH;

          ctx.translate(originalW / 2 + transX, originalH / 2 + transY);
          ctx.scale(sliceConfig.scale / 100, sliceConfig.scale / 100);
          ctx.translate(-originalW / 2, -originalH / 2);

          // 繪製原始圖片
          ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, originalW, originalH);

          // 智慧邊界連通去背：只清除與四周相連的幕布，保留角色內部相同顏色。
          const imageData = ctx.getImageData(0, 0, sliceWidth, sliceHeight);
          const data = imageData.data;
          const [kr, kg, kb] = getKeyColor().rgb;
          const tolerance = bgMode === 'mode1' ? 25 + Math.round(greenStrength * 0.9) : 18 + Math.round(greenStrength * 0.25);
          const total = sliceWidth * sliceHeight;
          const visited = new Uint8Array(total);
          const removed = new Uint8Array(total);
          const queue = new Int32Array(total);
          let head = 0, tail = 0;
          const matchesKey = (idx, extra = 0) => {
            const p = idx * 4;
            return Math.max(Math.abs(data[p] - kr), Math.abs(data[p + 1] - kg), Math.abs(data[p + 2] - kb)) <= tolerance + extra;
          };
          const enqueue = (idx) => {
            if (!visited[idx] && matchesKey(idx)) { visited[idx] = 1; queue[tail++] = idx; }
          };
          for (let x = 0; x < sliceWidth; x++) { enqueue(x); enqueue((sliceHeight - 1) * sliceWidth + x); }
          for (let y = 0; y < sliceHeight; y++) { enqueue(y * sliceWidth); enqueue(y * sliceWidth + sliceWidth - 1); }
          while (head < tail) {
            const idx = queue[head++];
            removed[idx] = 1;
            data[idx * 4 + 3] = 0;
            const x = idx % sliceWidth;
            if (x > 0) enqueue(idx - 1);
            if (x < sliceWidth - 1) enqueue(idx + 1);
            if (idx >= sliceWidth) enqueue(idx - sliceWidth);
            if (idx < total - sliceWidth) enqueue(idx + sliceWidth);
          }
          if (edgeCleanup) {
            // 柔化幕布與主體交界的半透明毛邊，但不向主體內部持續擴張。
            for (let idx = 0; idx < total; idx++) {
              if (removed[idx]) continue;
              const x = idx % sliceWidth;
              const touchesRemoved = (x > 0 && removed[idx - 1]) || (x < sliceWidth - 1 && removed[idx + 1]) || (idx >= sliceWidth && removed[idx - sliceWidth]) || (idx < total - sliceWidth && removed[idx + sliceWidth]);
              if (touchesRemoved && matchesKey(idx, Math.round(tolerance * 0.65))) {
                const p = idx * 4;
                data[p + 3] = Math.min(data[p + 3], 90);
              }
            }
          }
          ctx.putImageData(imageData, 0, 0);

          // --- 最終轉換：加入 LINE 官方安全邊距 (370x320 畫布，預留 10px 外距) ---
          const finalCanvas = document.createElement('canvas');
          finalCanvas.width = getProduct().outputW;
          finalCanvas.height = getProduct().outputH;
          const fCtx = finalCanvas.getContext('2d');
          
          // 安全區縮小為 350x300，確保邊緣不會切齊
          const margin = getProduct().emoji ? 2 : (getProduct().animated ? 0 : 10);
          const safeW = finalCanvas.width - margin * 2;
          const safeH = finalCanvas.height - margin * 2;
          const scaleToFit = Math.min(safeW / sliceWidth, safeH / sliceHeight);
          const finalW = sliceWidth * scaleToFit;
          const finalH = sliceHeight * scaleToFit;
          const finalX = (finalCanvas.width - finalW) / 2;
          const finalY = (finalCanvas.height - finalH) / 2;
          
          fCtx.drawImage(canvas, finalX, finalY, finalW, finalH);
          results.push(finalCanvas.toDataURL('image/png'));
        }

        setProcessedImages(results);
        setIsProcessing(false);
      };

      // Generate Prompt Data
      const getPromptData = () => [
        {
          title: '[1. 任務與20格規格]',
          items: [
            { label: '任務', value: getProduct().animated ? `製作${getProduct().label}分鏡表：共20格，每連續5格為同一個動畫的5個連續畫格，最後合成4個正式APNG。` : `製作一張${getProduct().label}圖集；本次固定20張，兩次合計40張。`, type: 'orange' },
            { label: '畫幅', value: `${getSourceSpec().w}×${getSourceSpec().h}px橫式畫面；固定5欄×4列，共20個彼此獨立的隱形單元，每格${getSourceSpec().cellW}×${getSourceSpec().cellH}px。`, type: 'blue' },
            { label: '獨立性', value: '每格只能有一個完整貼圖設計；禁止跨格、黏連、重疊、合併、共用角色、少格或多格。', type: 'blue' },
            { label: '無格線', value: '禁止畫出任何實體框線或分隔線，但每格之間必須保留清楚的純色背景間距。', type: 'blue' }

        },
        {
          title: '[2. 角色鎖定設定]',
          items: [
            { label: '角色來源', value: getCharacterRule(), type: 'orange' },
            { label: '一致性', value: selections.contentMode === 'text_only' ? '純文字模式不使用角色。' : '20格必須是同一角色：固定臉型、五官位置、頭身比例、身體顏色、服裝、配件、線條與材質；只能改變姿勢、手勢、表情與視線。', type: 'blue' },
            { label: '禁止走樣', value: selections.contentMode === 'text_only' ? '禁止加入人物、動物、吉祥物或裝飾角色。' : '禁止改變毛色與服裝、增加或減少肢體、變成不同年齡、不同角色或不同畫風。', type: 'blue' }
          ]
        },
        {
          title: '[3. 用語、表情與動作]',
          items: [
            ...(getProduct().emoji ? [
              { label: '表情貼形式', value: `${getEmojiLayout().label}：${getEmojiLayout().rule}`, type: 'orange' },
              { label: '文字占比', value: `文字約占畫面${textRatio}%；必須是第一眼最容易看見與讀懂的元素。`, type: 'orange' },
              { label: '文字長度', value: '每張以1～4個繁體中文字為原則；短字必須放大，禁止細字、過度潦草、複雜漸層與低對比配色。', type: 'blue' },
              ...((emojiLayout === 'handwriting' || emojiLayout === 'bold_text') ? [{ label: '文字筆觸', value: `${handwritingStyle}風格；保有自然手寫感，但筆畫必須夠粗、字形完整、縮小至180×180仍清楚。`, type: 'orange' }] : []),
              ...((emojiLayout === 'icon_text' || emojiLayout === 'bold_text') ? [{ label: '輔助圖示', value: iconOption === '自動搭配' ? '依每句文字語意搭配一個最簡單的小圖示，例如電話、信封、星星、愛心、驚嘆號或小喇叭。' : `統一以「${iconOption}」為主要輔助圖示；圖示不可搶過文字。`, type: 'blue' }] : []),
              ...(getProduct().animated ? [{ label: '動畫方式', value: `文字在5個畫格中固定位置、大小、字形與顏色，禁止晃動及變形；只讓小圖示、色塊或局部元素以「${animationOption}」方式動作。`, type: 'orange' }] : [])
            ] : []),
            { label: '內容模式', value: getModeRules().rule, type: 'orange' },
            { label: '指定用語', value: getProduct().animated ? (selections.contentMode === 'char_only' ? `設計4個不同動畫，每個動畫5個連續畫格；順序為01–05、06–10、11–15、16–20。` : `四個動畫依序使用：${getPhraseArray().slice(0,4).map((t,i)=>`${i+1}.「${t}」`).join('；')}。每句文字在所屬5格中完全相同。`) : (selections.contentMode === 'char_only' ? `依照「${selections.subject}」設計20種語意清楚、不重複的動作與表情，不放任何文字。` : getPhraseText()), type: 'orange' },
            { label: getProduct().animated ? '分鏡連續性' : '不足20句', value: getProduct().animated ? '同一組5格必須保持角色位置、比例、鏡位、服裝與文字完全一致，只讓動作循序變化；第5格需能自然銜接第1格循環播放。' : (selections.contentMode === 'char_only' || getPhraseArray().length === 20 ? '目前內容可直接依序製作20格。' : `目前指定${getPhraseArray().length}句；請依「${selections.subject}」補足至20句，新增內容不得與既有用語重複。`), type: 'blue' },
            { label: '文字正確', value: selections.contentMode === 'char_only' ? '禁止任何文字、字母、數字、符號、對話框與浮水印。' : '每格只放一句；指定文字必須逐字照抄，使用繁體中文，禁止改寫、錯字、漏字、增字、簡體字、重複、英文翻譯、emoji及【】符號。', type: 'blue' },

          ]
        },
        {
          title: '[4. 版面與安全距離]',
          items: [
            { label: '產品構圖', value: getProduct().emoji ? `${getEmojiLayout().label}，文字占比${textRatio}%。表情貼顯示很小，必須以粗大清楚文字及簡潔圖案為主，避免長句、細節裝飾與過多留白。` : '一般貼圖可使用半身或全身動作，表情、手勢與文字都必須清楚。', type: 'orange' },

            { label: '邊緣品質', value: '禁止幕布色反光、溢色或毛邊污染主體邊緣；水彩、墨跡與陰影不得擴散進幕布。', type: 'blue' }
          ]
        },
        {
          title: '[7. 輸出前逐格核對]',
          items: [

                      </div>
                    </div>

                    <div className="mt-6 text-center text-emerald-400 text-sm font-bold">
                      ☝️ 請注意檢查「綠色虛線」：如果在預覽中文字被切到，切割出來就會被切到，請利用下方滑桿微調！
                    </div>

                    <div className="mt-6 bg-[#0f172a] p-6 rounded-xl border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-6">
                      <div className="flex-1 w-full space-y-2">
                        <div className="flex justify-between text-xs font-bold text-slate-400"><span>水平平移 (X)</span><span>{sliceConfig.x}%</span></div>
                        <input type="range" min="-100" max="100" value={sliceConfig.x} onChange={(e) => setSliceConfig({...sliceConfig, x: Number(e.target.value)})} className="w-full accent-emerald-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                      </div>
                      <div className="flex-1 w-full space-y-2">
                        <div className="flex justify-between text-xs font-bold text-slate-400"><span>垂直平移 (Y)</span><span>{sliceConfig.y}%</span></div>
                        <input type="range" min="-100" max="100" value={sliceConfig.y} onChange={(e) => setSliceConfig({...sliceConfig, y: Number(e.target.value)})} className="w-full accent-emerald-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                      </div>
                      <div className="flex-1 w-full space-y-2">
                        <div className="flex justify-between text-xs font-bold text-slate-400"><span>整體縮放尺寸</span><span>{sliceConfig.scale}%</span></div>
                        <input type="range" min="10" max="200" value={sliceConfig.scale} onChange={(e) => setSliceConfig({...sliceConfig, scale: Number(e.target.value)})} className="w-full accent-emerald-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                      </div>
                    </div>

                    <div className="mt-8 flex justify-center">
                      <button onClick={() => setIsSliced(true)} className="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3.5 rounded-xl font-bold text-lg flex items-center shadow-lg shadow-emerald-500/20 transition-all active:scale-95">
                        <Scissors className="w-6 h-6 mr-2" /> 開始切割 (20格)
                      </button>
                    </div>
                  </div>
                )}

                {/* 狀態三：預覽切割並設定去背模式 */}
                {isSliced && processedImages.length === 0 && (
                  <div className="bg-[#1e293b] rounded-xl border border-slate-700/50 p-6 md:p-8 shadow-xl max-w-5xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-xl font-bold text-white flex items-center">
                        <CheckCircle2 className="w-6 h-6 mr-2 text-emerald-400" /> 切割完成，請設定去背模式
                      </h2>
                    </div>

                    <div className="grid grid-cols-5 gap-2 md:gap-3 bg-[#0f172a] p-4 md:p-6 rounded-xl border border-slate-800 shadow-inner max-h-[500px] overflow-y-auto">
                      {Array.from({ length: 20 }).map((_, i) => {
                        const col = i % 5;
                        const row = Math.floor(i / 5);
                        return (
                          <div key={i} className="w-full rounded border border-slate-700/50 overflow-hidden bg-slate-800 relative" style={{aspectRatio: `${getSourceSpec().cellW}/${getSourceSpec().cellH}`}}>
                            <div style={{
                              position: 'absolute',
                              width: '500%',
                              height: '400%',
                              left: `-${col * 100}%`,
                              top: `-${row * 100}%`
                            }}>
                              <img
                                src={previewUrl}
                                className="w-full h-full object-fill pointer-events-none"
                                style={{
                                  transform: `translate(${sliceConfig.x}%, ${sliceConfig.y}%) scale(${sliceConfig.scale/100})`,
                                  transformOrigin: 'center'
                                }}
                                alt={`切片-${i}`}
                              />
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    <div className="mt-8 bg-[#0f172a] p-6 rounded-xl border border-slate-800 text-slate-200 shadow-inner">
                      <div className="text-center font-bold text-white mb-6 tracking-wide text-sm">去背模式選擇：</div>
                      <div className="flex flex-col md:flex-row gap-4 max-w-2xl mx-auto">
                        <button onClick={() => setBgMode('mode1')} className={`flex-1 p-5 rounded-xl font-bold flex flex-col items-center justify-center transition-all ${bgMode === 'mode1' ? 'bg-[#ef4444] text-white shadow-lg shadow-red-500/30 scale-105 border-2 border-red-400' : 'bg-[#1e293b] text-slate-400 border border-slate-700 hover:bg-slate-800'}`}>
                            <span className="text-base tracking-wide">模式1：智慧邊界去背</span>
                            <span className="text-xs font-medium mt-1.5 opacity-90">只移除與四周相連的底色</span>
                        </button>
                        <button onClick={() => setBgMode('mode2')} className={`flex-1 p-5 rounded-xl font-bold flex flex-col items-center justify-center transition-all ${bgMode === 'mode2' ? 'bg-[#334155] text-white shadow-lg shadow-slate-900/50 scale-105 border-2 border-slate-400' : 'bg-[#1e293b] text-slate-400 border border-slate-700 hover:bg-slate-800'}`}>
                            <span className="text-base tracking-wide">模式2：純色精準去背</span>
                            <span className="text-xs font-medium mt-1.5 opacity-90">背景非常純時使用</span>
                        </button>
                      </div>
                      <div className="max-w-2xl mx-auto mt-6 bg-slate-900/60 rounded-lg p-4 border border-slate-700">
                        <div className="text-xs font-bold text-slate-300 mb-3">本張圖片的去背底色</div>
                        <div className="grid grid-cols-3 gap-2 mb-5">
                          {KEY_COLORS.map(color => (
                            <button key={color.id} onClick={() => setKeyColorId(color.id)} className={`rounded-md p-2 text-[11px] font-bold border ${keyColorId === color.id ? 'border-white text-white bg-slate-700' : 'border-slate-700 text-slate-400'}`}>
                              <span className="inline-block w-3 h-3 rounded-sm mr-1 align-middle border border-white/40" style={{backgroundColor: color.hex}}></span>{color.label}
                            </button>
                          ))}
                        </div>
                        <div className="flex justify-between text-xs font-bold text-slate-300 mb-2"><span>去綠強度</span><span>{greenStrength}%</span></div>
                        <input type="range" min="0" max="100" value={greenStrength} onChange={(e) => setGreenStrength(Number(e.target.value))} className="w-full accent-emerald-500" />
                        <label className="mt-4 flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                          <input type="checkbox" checked={edgeCleanup} onChange={(e) => setEdgeCleanup(e.target.checked)} className="accent-emerald-500" />
                          淡化半透明綠邊（建議開啟）
                        </label>
                      </div>
                      <div className="text-xs text-slate-400 mt-6 text-center flex items-center justify-center">
                        <CheckCircle2 className="w-4 h-4 mr-2 text-emerald-500 flex-shrink-0" />
                        {bgMode === 'mode1' ? `只移除與四周相連的${getKeyColor().label}，角色內部相同顏色會保留` : `以較低容差精準移除${getKeyColor().label}，適合背景色非常純淨時使用`}
                      </div>
                    </div>

                    <div className="mt-8 flex justify-center gap-4">
                      <button onClick={handleReset} className="px-8 py-3.5 rounded-xl font-bold text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors">
                          重新上傳
                      </button>
                      <button 
                        onClick={processImages} 
                        disabled={isProcessing}
                        className="px-10 py-3.5 rounded-xl font-bold text-white bg-emerald-500 hover:bg-emerald-600 shadow-lg shadow-emerald-500/20 transition-transform active:scale-95 flex items-center disabled:opacity-50 disabled:active:scale-100"
                      >
                        {isProcessing ? <Loader2 className="w-5 h-5 mr-2 animate-spin" /> : <Wand2 className="w-5 h-5 mr-2" />}
                        {isProcessing ? '正在執行像素去背...' : '執行去背處理'}
                      </button>
                    </div>
                  </div>
                )}

                {/* 狀態四：最終去背成果與標籤設定 */}
                {processedImages.length > 0 && (
                  <div className="bg-[#1e293b] rounded-xl border border-slate-700/50 p-6 md:p-8 shadow-xl max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-xl font-bold text-white flex items-center">
                        <Wand2 className="w-6 h-6 mr-2 text-emerald-400" /> 去背完成，請設定{getProduct().emoji ? '分頁圖' : '封面與分頁圖'}
                      </h2>
                      <button onClick={handleReset} className="text-sm text-slate-400 hover:text-white font-bold flex items-center transition-colors">
                        <RefreshCcw className="w-4 h-4 mr-1" /> 重做
                      </button>
                    </div>

                    <div className="mb-8 pb-8 border-b border-slate-700">
                      <h3 className="text-xl font-bold text-white mb-6 flex items-center">
                        <CheckCircle2 className="w-6 h-6 mr-2 text-emerald-400" /> 設定與打包下載
                      </h3>
                      <div className="flex flex-col lg:flex-row gap-6 items-stretch">
                        
                        <div className="flex-1 bg-slate-800/50 border border-yellow-500/30 rounded-xl p-6 shadow-inner flex flex-col justify-center">
                          <div className="flex items-center text-yellow-500 font-bold mb-3 text-lg">
                            <Info className="w-5 h-5 mr-2" /> 下載前注意事項：
                          </div>
                          <ul className="text-sm text-slate-300 space-y-3 list-disc ml-6 leading-relaxed">
                            <li>目前模式：<span className="text-white font-bold">{getProduct().label}</span>，{getProduct().note}。</li>
                            <li>{getProduct().emoji ? '選擇Tab分頁圖。' : '選擇Main封面圖與Tab分頁圖。'}</li>
                            <li>第二批起始編號請設為 <span className="text-white font-bold">{getProduct().animated ? '5' : '21'}</span>。</li>
                            <li className="text-emerald-400 font-medium mt-2">系統會輸出{getProduct().outputW}×{getProduct().outputH}px，檔名使用{getProduct().digits}位數。</li>
                          </ul>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-4">
                          {getProduct().animated && (
                            <div className="bg-[#0f172a] border border-slate-700 rounded-xl p-4 w-full sm:w-44 shadow-inner">
                              <label className="text-xs font-bold text-slate-400">每格時間：{frameDelay}ms</label>
                              <input type="range" min="80" max="500" step="20" value={frameDelay} onChange={(e)=>setFrameDelay(Number(e.target.value))} className="w-full accent-emerald-500 mt-2" />
                              <div className="text-[10px] text-slate-500 mt-1">5格總長 {(frameDelay*5/1000).toFixed(1)}秒</div>
                            </div>
                          )}
                          <div className="bg-[#0f172a] border border-slate-700 rounded-xl p-4 flex flex-col justify-center w-full sm:w-32 shadow-inner">
                            <label className="text-xs font-bold text-slate-400 mb-2"># 起始編號</label>
                            <input
                              type="number"
                              min="1"
                              value={startNumber}
                              onChange={(e) => setStartNumber(e.target.value)}
                              className="w-full bg-[#1e293b] text-white border border-slate-600 rounded-lg px-3 py-2 text-center font-bold outline-none focus:border-emerald-500 transition-colors"
                            />
                          </div>
                          <button 
                            onClick={handleDownloadZip}
                            disabled={isDownloading}
                            className="px-8 py-4 h-full rounded-xl font-bold text-white bg-[#10b981] hover:bg-[#059669] shadow-lg shadow-emerald-500/20 transition-transform active:scale-95 flex items-center justify-center text-lg disabled:opacity-70 disabled:active:scale-100 whitespace-nowrap"
                          >
                            {isDownloading ? <Loader2 className="w-6 h-6 mr-2 animate-spin" /> : <Download className="w-6 h-6 mr-2" />}
                            {isDownloading ? '打包中...' : '下載完整 ZIP'}
                          </button>
                        </div>
                      </div>
                    </div>

                    {getProduct().animated && (
                      <div className="mb-8">
                        <h3 className="text-white font-bold mb-3">動畫預覽（每5格合成1個）</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                          {[0,1,2,3].map(group => <div key={group} className="bg-[#0f172a] rounded-lg p-3 border border-slate-700 text-center">
                            <img src={processedImages[group*5+previewFrame]} className="w-full object-contain rounded" style={{aspectRatio:`${getProduct().outputW}/${getProduct().outputH}`}} />
                            <div className="text-xs text-emerald-400 mt-2">動畫 {group+1}・畫格 {previewFrame+1}/5</div>
                          </div>)}
                        </div>
                      </div>
                    )}

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                      {processedImages.map((src, i) => (
                        <div key={i} className="bg-[#0f172a] rounded-lg p-3 border border-slate-800 flex flex-col group hover:border-slate-600 transition-colors">
                          
                          <div 
                            className="w-full rounded overflow-hidden relative border border-slate-800/50"
                            style={{
                              aspectRatio: `${getProduct().outputW}/${getProduct().outputH}`,
                              backgroundImage: `linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%)`,
                              backgroundSize: '16px 16px',
                              backgroundPosition: '0 0, 0 8px, 8px -8px, -8px 0px',
                              backgroundColor: '#0f172a'
                            }}
                          >
                            <img src={src} className="w-full h-full object-contain" alt={`sticker-${i+1}`} />
                          </div>

                          <div className="text-center text-[11px] font-mono font-medium text-slate-400 my-2 bg-slate-800/80 py-1.5 rounded-md mx-1">
                            {getProduct().animated ? `動畫${Math.floor(i/5)+1}・畫格${i%5+1}` : `${String((parseInt(startNumber) || 1) + i).padStart(getProduct().digits, '0')}.png`}
                          </div>

                          <div className="flex gap-1.5 mt-auto">
                            {!getProduct().emoji && <button
                              onClick={() => setMainIndex(mainIndex === i ? null : i)}
                              className={`flex-1 flex flex-col sm:flex-row items-center justify-center py-2 rounded text-[10px] font-bold transition-all ${
                                mainIndex === i
                                  ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 shadow-[0_0_10px_rgba(16,185,129,0.2)]'
                                  : 'bg-slate-800 text-slate-500 border border-slate-700 hover:bg-slate-700 hover:text-slate-300'
                              }`}
                            >
                              <Star className={`w-3.5 h-3.5 sm:mr-1 mb-1 sm:mb-0 ${mainIndex === i ? 'fill-emerald-400' : ''}`} /> Main
                            </button>}
                            <button
                              onClick={() => setTabIndex(tabIndex === i ? null : i)}
                              className={`flex-1 flex flex-col sm:flex-row items-center justify-center py-2 rounded text-[10px] font-bold transition-all ${
                                tabIndex === i
                                  ? 'bg-blue-500/20 text-blue-400 border border-blue-500/50 shadow-[0_0_10px_rgba(59,130,246,0.2)]'
                                  : 'bg-slate-800 text-slate-500 border border-slate-700 hover:bg-slate-700 hover:text-slate-300'
                              }`}
                            >
                              <Tag className={`w-3.5 h-3.5 sm:mr-1 mb-1 sm:mb-0 ${tabIndex === i ? 'fill-blue-400' : ''}`} /> Tab
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
